<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Своя лига — 3D-состав</title><style>*{box-sizing:border-box}body{margin:0;background:#17201c;color:#eee7d8;font-family:Arial,sans-serif}header{padding:32px 36px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:29px;margin:0 0 8px}p{color:#aeb6ad;font-size:12px;margin:0}a{color:#e6ae76}main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 30px 30px}.character{border:1px solid #ffffff1c;background:#202b24;border-radius:9px;overflow:hidden}.portrait{width:100%;height:270px;display:block;object-fit:contain}.name{padding:14px 18px;border-top:1px solid #ffffff10;display:flex;justify-content:space-between}strong{font-size:16px}.name span{font-size:11px;color:#a8b5ac}footer{padding:8px 36px 25px;font-size:11px;color:#a4b0a5}@media(max-width:700px){main{grid-template-columns:repeat(2,1fr);padding:0 12px 15px;gap:8px}header{padding:24px 15px}h1{font-size:22px}.portrait{height:235px}.name{padding:10px}.name span{font-size:9px}}</style></head><body><header><div><h1>Своя лига / состав</h1><p id="label">Игровые 3D-модели · объёмные черты лица</p></div><a href="index.html">К игре ↗</a></header><main id="grid"></main><footer>Модели из игры. Для вращения и приближения открой персонажа в меню выбора.</footer><script type="module">
import * as T from './vendor/three.module.min.js';import{PLAYERS,REFEREE}from'./src/roster.js?v=0.4.0';import{createCharacter,disposeObject}from'./src/models.js?v=0.4.0';
const full=new URLSearchParams(location.search).has('full');if(full)document.getElementById('label').textContent='Игровые 3D-модели · рост и пропорции';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(480,500);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
for(const p of [...PLAYERS,REFEREE]){const scene=new T.Scene();scene.background=new T.Color(0x202b24);scene.add(new T.HemisphereLight(0xe0e9ff,0x665848,1.35));const key=new T.DirectionalLight(0xffe4ca,2.65);key.position.set(-3,4,5);scene.add(key);const fill=new T.DirectionalLight(0xbbd1ea,.9);fill.position.set(3,2,4);scene.add(fill);const rim=new T.DirectionalLight(0xffd3a3,1.8);rim.position.set(1,3,-2);scene.add(rim);const model=createCharacter(p,0);model.rotation.y=.16;model.userData.ring.visible=false;scene.add(model);const camera=new T.PerspectiveCamera(30,480/500,.025,20);camera.position.set(.015,full?1.02:1.685*p.scale,full?4.15:.79);camera.lookAt(0,full?1.02:1.671*p.scale,0);renderer.render(scene,camera);const article=document.createElement('article');article.className='character';const img=new Image();img.className='portrait';img.alt='3D-модель '+p.name;img.src=renderer.domElement.toDataURL();article.append(img);const name=document.createElement('div');name.className='name';name.innerHTML='<strong>'+p.name+'</strong><span>'+(p.referee?'Судья':p.height+' рост')+'</span>';article.append(name);document.getElementById('grid').append(article);disposeObject(scene);}renderer.dispose();window.modelsReady=true;
</script></body></html>
